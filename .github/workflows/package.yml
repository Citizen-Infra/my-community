name: Package Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-zip:
    runs-on: ubuntu-latest
    steps:
      # v4 of these ran on Node 20, which GitHub deprecated — every run was
      # force-migrated to Node 24 and warned. v5/v6 are where each moved to
      # Node 24 properly; v7 is current (#103).
      #
      # setup-node v5 starts auto-caching when package.json carries a
      # `packageManager` field. Neither package.json here has one, and `cache:`
      # is set explicitly below in any case — but check both if that changes.
      # checkout v7 blocks fork checkouts for pull_request_target/workflow_run;
      # this workflow triggers on workflow_dispatch and v* tags, so it is inert.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # NOT the action runtime — this is the Node the extension is BUILT
          # with, and 20 is past end of life. Bumping it changes the shipped
          # artifact, so it is a separate decision from the action versions
          # above and deliberately not folded in here. Tracked in #103.
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build and package zip
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          chmod +x scripts/package-zip.sh
          ./scripts/package-zip.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-community-zip
          path: '*.zip'

      - name: Extract release notes from changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the "### <version> — ..." section out of the README changelog,
          # up to the next "### " heading, and use it as the release body.
          awk -v v="$VERSION" '
            /^### / { if (m) exit; if ($2 == v) { m=1; next } }
            m { print }
          ' README.md > release-notes.md
          if ! grep -q "[^[:space:]]" release-notes.md; then
            echo "Release $VERSION. See the changelog in README.md." > release-notes.md
          fi
          echo "=== release-notes.md ==="
          cat release-notes.md

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        # v3 is a runtime move to Node 24 and nothing else — "keep the floating
        # major tag on v3", no API change. Third-party, so it is not covered by
        # the GitHub-owned actions' analysis above; read its notes before the
        # next bump rather than assuming.
        uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          body_path: release-notes.md
